on:
  push:
    branches: [main]

env:
  WORKSPACE: ${{ github.workspace }}
  KERNEL: "${{ github.workspace }}/kernel"

jobs:
  build:
    runs-on: ubuntu-latest

    permissions:
      contents: write

    defaults:
      run:
        shell: bash

    steps:
    - uses: actions/checkout@v4

    - name: free_disk_space       
      uses: jlumbroso/free-disk-space@main
      with:
        tool-cache: false
        android: true
        dotnet: true
        haskell: true
        large-packages: true
        docker-images: true
        swap-storage: true
    
    - name: install_packages
      run: |
        sudo apt-get update && sudo apt-get install -y git-core gnupg flex bison build-essential zip curl zlib1g-dev libxml2-utils xsltproc unzip ccache repo
          
    - name: clone_kernel_source
      working-directory: ${{ github.workspace }}
      run: |
        mkdir -p $KERNEL && cd $KERNEL
        
        repo init --depth=1 -u https://android.googlesource.com/kernel/manifest -b common-android13-5.10
        
        repo --trace sync -c -j$(nproc --all) --no-tags --fail-fast
        
        cd ./common
        
        git fetch --depth=1 https://android.googlesource.com/kernel/common refs/tags/android13-5.10-2024-11_r6
        
        git checkout -b android13-5.10-2024-11_r6 FETCH_HEAD
        
    - name: clone_wild_patches
      working-directory: ${{ github.workspace }}
      run: |
        git clone https://github.com/WildKernels/kernel_patches.git
        
    - name: ksu_setup
      working-directory: ${{ env.KERNEL }}
      run: |
        curl -LSs "https://raw.githubusercontent.com/ReSukiSU/ReSukiSU/main/kernel/setup.sh" | bash
        
    - name: susfs_setup
      working-directory: ${{ env.KERNEL }}
      run: |
        git clone -b gki-android13-5.10 --single-branch https://gitlab.com/simonpunk/susfs4ksu.git
        
        cd ./susfs4ksu

        #git checkout f2878eb5c0c9c7082212ef109b9e9e5042fd9fab
        
        cp ./kernel_patches/50_add_susfs_in_gki-android13-5.10.patch ../common/
        cp -r ./kernel_patches/fs/* ../common/fs/
        cp -r ./kernel_patches/include/linux/* ../common/include/linux/
        
        cd ../common
        
        patch -p1 < 50_add_susfs_in_gki-android13-5.10.patch
        
    - name: bbg_setup
      working-directory: ${{ env.KERNEL }}
      run: |
        wget -O- https://github.com/vc-teahouse/Baseband-guard/raw/main/setup.sh | bash
        
        sed -i '/^config LSM$/,/^help$/{ /^[[:space:]]*default/ { /baseband_guard/! s/selinux/selinux,baseband_guard/ } }' ./common/security/Kconfig
        
    - name: bbrv3_setup
      working-directory: ${{ env.KERNEL }}/common
      run: |
        sed -i 's/CONFIG_IP_SET_MAX/65534/g' ./net/netfilter/ipset/ip_set_core.c
        
        # apply patches
        patch -p1 < "$WORKSPACE/kernel_patches/common/bbrv3/0001-net-tcp-backport-BBRv3-to-android12-5.10.patch"
        
        if ! grep -qF 'int proc_dou8vec_minmax(' ./include/linux/sysctl.h; then
          patch -p1 < "$WORKSPACE/kernel_patches/common/bbrv3/sysctl_add_proc_dou8vec_minmax.patch"
          patch -p1 < "$WORKSPACE/kernel_patches/common/bbrv3/sysctl_fix_data-races_in_proc_dou8vec_minmax.patch"
        fi
     
    - name: delete_exports
      working-directory: ${{ env.KERNEL }}
      run: |
        rm -rf ./common/android/abi_gki_protected_exports_aarch64
        
    - name: fix_flags
      working-directory: ${{ env.KERNEL }}
      run: |
        sed -i 's/vm_flags_clear(new_vma,VM_PAD_MASK);/new_vma->vm_flags \&= ~VM_PAD_MASK;/g' ./common/mm/mmap.c
        
        echo 'CFLAGS_susfs.o += -Wno-unused-function -Wno-unused-variable' >> ./common/fs/Makefile
        
    - name: fix_export_symbols
      working-directory: ${{ env.KERNEL }}
      run: |
        printf 'EXPORT_SYMBOL(%s);\n' \
          "susfs_is_current_ksu_domain" \
          "susfs_is_current_zygote_domain" \
          "susfs_is_current_init_domain" \
          >> ./common/drivers/kernelsu/selinux/selinux.c
        
    - name: apply_config_fragment
      working-directory: ${{ env.KERNEL }}/common
      run: |
        DEFCONFIG="arch/arm64/configs/gki_defconfig"
        FRAGMENT="$WORKSPACE/config.fragment"
        
        apply_line() {
          local line="$1"
          
          line="$(echo "$line" | xargs)"   

          [[ -z "$line" || "$line" == \#* ]] && return

          local key value
          
          if [[ "$line" == *"="* ]]; then
            key="${line%%=*}"
            value="${line#*=}"
          else
            key="$line"
            value="y"
          fi
          
          echo "apply: $key=$value"
  
          if grep -q "^$key=" "$DEFCONFIG"; then
            sed -i "s|^$key=.*|$key=$value|g" "$DEFCONFIG"
          elif grep -q "^# $key is not set" "$DEFCONFIG"; then
            sed -i "s|^# $key is not set|$key=$value|g" "$DEFCONFIG"
          else
            echo "$key=$value" >> "$DEFCONFIG"
          fi
        }

        while IFS= read -r line || [ -n "$line" ]; do
          apply_line "$line"
        done < "$FRAGMENT"

    - name: set_kernel_version
      working-directory: ${{ env.KERNEL }}/common
      run: |
        sed -i 's/-dirty//' ./scripts/setlocalversion
        
    - name: commit_changes
      working-directory: ${{ env.KERNEL }}/common
      run: |
        commit_repo() {
          local dir="$1"
          
          cd "$dir"
          
          git config user.email "build@github.com"
          git config user.name "miojo_o"
          
          git add -A
          
          git diff --cached --quiet || git commit -m "miojo_o clean dirty"
        }
        
        commit_repo "$KERNEL/KernelSU"
        commit_repo "$KERNEL/common"
        
    - name: make_image
      working-directory: ${{ env.KERNEL }}
      run: |
        set -euo pipefail
        
        # skip savedefconfig check
        sed -i 's/check_defconfig//' ./common/build.config.gki
        
        export LTO=thin
        
        export SKIP_EXT_MODULES=1
        export SKIP_CP_KERNEL_HDR=1
        export SKIP_MRPROPER=1
        
        export BUILD_CONFIG=common/build.config.gki.aarch64
        
        build/build.sh 2>&1 | tee build.log
  
    - name: check_config_after_build
      working-directory: ${{ env.KERNEL }}
      run: |
        grep -E "BBG|KSU|BBR|TCP_CONG" ./out/android13-5.10/common/.config
        
        cat ./out/android13-5.10/common/include/generated/utsrelease.h
      
    - name: make_anykernel3
      working-directory: ${{ env.WORKSPACE }}
      run: |
        git clone https://github.com/osm0sis/AnyKernel3 anykernel3
        
        cd ./anykernel3

        git checkout dca9dc370838d919d56c1f59ec78b27a14a72c68
        
        cd ../
        
        cp "$KERNEL/out/android13-5.10/dist/Image" ./anykernel3/
        
        cp ./anykernel.sh ./anykernel3/anykernel.sh
        
        cd anykernel3
        
        zip -r9 ../resukisu-5.10.223-android13-2024-11-anykernel3.zip . -x "*.git*"

    - name: get_ksu_driver
      working-directory: ${{ env.KERNEL }}
      run: |
        KSU_DRIVER=$(grep "version code" ./build.log | grep -oP '\d+' | head -1)
        
        echo "KSU_DRIVER=$KSU_DRIVER" >> $GITHUB_ENV
        echo "ksu driver: $KSU_DRIVER"
        
    - name: upload_anykernel3
      uses: actions/upload-artifact@v4
      with:
        name: resukisu-5.10.223-android13
        path: ${{ github.workspace }}/resukisu-5.10.223-android13-2024-11-anykernel3.zip
        compression-level: 9

    - name: create_release
      uses: softprops/action-gh-release@v2
      with:
        files: ${{ github.workspace }}/resukisu-5.10.223-android13-2024-11-anykernel3.zip
        tag_name: v${{ github.run_number }}
        name: ReSukiSU Build ${{ github.run_number }}
        body: |
          ## ReSukiSU + SuSFS 2.2.0 + BBG + BBR
      
          - Kernel: 5.10.223 (android13-2024-11_r6)
          - ksu_driver: (main) ${{ env.KSU_DRIVER }}

          - tested in: a14 5g
      
          ## install
          flash ak3 using horizon kernel flasher or custom recovery
          
          https://github.com/libxzr/HorizonKernelFlasher/releases
          
    
